<title>샤들링 시제품</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="css/style.css">

<div id="app">
  <canvas id="game" aria-label="샤들링 3마리가 떠 있는 섬에서 자동으로 사냥하는 게임 화면"></canvas>
  <div id="top" class="band">
    <div class="row"><div id="stage">1번 섬 · 새싹 들판</div><div id="lvl">0 G</div><div id="fps">-- fps</div></div>
    <div class="row"><div id="gaugeBar" class="bar"><i id="gauge"></i><b id="gaugeTxt">토벌 0/70</b></div></div>
    <div class="row">
      <div class="gems">
        <span class="gem" id="gFire" style="--c:var(--fire)">0</span>
        <span class="gem" id="gWater" style="--c:var(--water)">0</span>
        <span class="gem" id="gGrass" style="--c:var(--grass)">0</span>
        <span class="gem" id="gLight" style="--c:#ffe27a">0</span>
        <span class="gem" id="gDark" style="--c:#9b7fd6">0</span>
      </div>
      <button class="tiny" id="sound" type="button">소리</button>
      <button class="tiny" id="toTown" type="button">마을</button>
    </div>
  </div>
  <div id="banner"></div>
  <div id="hint">그냥 지켜보세요. 땅을 누르면 그쪽으로 이동해요.</div>
  <div id="bottom" class="band">
    <button class="skill" id="skCheer" type="button">응원<small>공격력 8초</small><span class="cd"></span></button>
    <button class="skill" id="skHeal" type="button">치유<small>회복·부활</small><span class="cd"></span></button>
    <button class="skill" id="skShield" type="button">보호막<small>보스 강타 막기</small><span class="cd"></span></button>
  </div>
  <div id="fade"></div>
  <div id="town" hidden>
    <canvas id="townScene" width="300" height="84" aria-label="조각 마을 풍경"></canvas>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="fuse">합성</button>
      <button type="button" role="tab" data-tab="party">샤들링</button>
      <button type="button" role="tab" data-tab="summon">소환</button>
      <button type="button" role="tab" data-tab="isle">섬</button>
    </div>
    <div id="townBody"></div>
    <div class="foot"><button class="go" id="depart" type="button">출발</button></div>
  </div>
  <div id="sheet" hidden>
    <canvas id="sheetArt"></canvas>
    <div id="sheetTitle"></div>
    <div id="sheetText"></div>
    <div class="swap" id="sheetSwap"></div>
    <button class="go" id="sheetClose" type="button">닫기</button>
  </div>
  <div id="reveal" hidden>
    <canvas id="revealArt"></canvas>
    <div id="revealTitle"></div>
    <div id="revealText"></div>
    <button class="go" id="revealOk" type="button" hidden>좋아요</button>
  </div>
</div>

<script src="js/balance.js"></script>
<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/game.js"></script>
<script src="js/town.js"></script>
<script src="js/main.js"></script>
