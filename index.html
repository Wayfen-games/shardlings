<title>샤들링 시제품</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 레이아웃: 폰 세로 전체가 도트 게임 화면, 위아래에 얇은 조작 띠. 한 가지 세계에 맞춘 단일 테마 */
:root{
  color-scheme:dark;
  --night:#231c3a; --panel:#352b57; --line:#120d24; --cream:#fff6dc; --dim:#b9aee0;
  --shard:#8cf2ff; --gold:#ffd45e; --red:#ff6b6b; --fire:#ff8a5c; --water:#58b6f0; --grass:#7fd46a;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--cream);font-family:var(--font);-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#8fd6f5}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;display:block}
.band{position:absolute;left:0;right:0;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
#top{top:0;padding-block:7px 8px;display:grid;gap:5px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
#stage{font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvl{font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
.bar{position:relative;height:15px;background:var(--line);flex:1;min-width:0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--shard);width:0}
.bar b{position:absolute;inset:0;text-align:center;font:400 12px/15px var(--font);color:var(--cream);text-shadow:1px 1px 0 var(--line)}
#gaugeBar.boss i{background:var(--red)}
#xpBar{height:4px;flex:none}
#xpBar i{background:var(--gold)}
.gems{display:flex;gap:10px;font-size:14px;font-variant-numeric:tabular-nums;flex:1;min-width:0}
.gem{display:inline-flex;align-items:center;gap:4px}
.gem::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--c);box-shadow:0 0 0 1px var(--line)}
.gem.pop{animation:pop .18s steps(2)}
@keyframes pop{50%{transform:translateY(-3px)}}
.tiny{appearance:none;border:0;background:var(--line);color:var(--dim);font:400 12px var(--font);padding:4px 7px;cursor:pointer;min-height:26px}
.tiny:focus-visible,.skill:focus-visible{outline:2px solid var(--shard);outline-offset:1px}
#fps{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
#bottom{bottom:0;padding-block:8px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skill{position:relative;appearance:none;border:0;background:#4b3d7a;color:var(--cream);font:400 16px var(--font);height:58px;overflow:hidden;cursor:pointer;box-shadow:inset 0 -4px 0 #30264f,inset 0 3px 0 #6a5aa3;-webkit-tap-highlight-color:transparent}
.skill small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.skill:active{transform:translateY(2px)}
.skill .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(18,13,36,.72);pointer-events:none}
.skill.urgent{background:var(--red);animation:urgent .22s steps(2) infinite}
@keyframes urgent{50%{background:var(--gold);color:var(--line)}}
#banner{position:absolute;left:12px;right:12px;top:32%;text-align:center;font-size:30px;color:var(--cream);text-shadow:2px 2px 0 var(--line),-2px 2px 0 var(--line),2px -2px 0 var(--line),-2px -2px 0 var(--line);pointer-events:none;text-wrap:balance}
#banner small{display:block;font-size:15px;margin-top:4px}
#banner.show{animation:stamp .28s steps(4)}
@keyframes stamp{0%{transform:scale(2);opacity:0}100%{transform:scale(1);opacity:1}}
#hint{position:absolute;left:0;right:0;text-align:center;font-size:13px;color:var(--cream);text-shadow:1px 1px 0 var(--line);pointer-events:none;transition:opacity .6s}
#fade{position:absolute;inset:0;background:var(--night);opacity:0;pointer-events:none;transition:opacity .5s}
#town,#reveal,#sheet{position:absolute;inset:0;background:var(--night)}
#town{display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}
#townScene{width:100%;aspect-ratio:300/84;image-rendering:pixelated;display:block}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--line)}
.tabs button{appearance:none;border:0;background:var(--panel);color:var(--dim);font:400 15px var(--font);padding:11px 0;cursor:pointer;box-shadow:inset 0 -3px 0 transparent}
.tabs button[aria-selected="true"]{color:var(--cream);box-shadow:inset 0 -3px 0 var(--shard)}
#townBody{overflow-y:auto;min-height:0;padding:12px max(12px,env(safe-area-inset-right,0px)) 14px max(12px,env(safe-area-inset-left,0px));display:grid;gap:10px;align-content:start}
#townBody h3{font:400 16px var(--font);margin:0}
#townBody p{margin:0;font-size:13px;line-height:1.45;color:var(--dim)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{appearance:none;border:0;background:var(--panel);color:var(--cream);font:400 13px var(--font);padding:7px 4px 8px;cursor:pointer;display:grid;justify-items:center;gap:3px;min-width:0;box-shadow:inset 0 -3px 0 #281f45}
.card canvas{height:48px;max-width:100%;image-rendering:pixelated}
.card.big canvas{height:76px}
.card small{font-size:11px;color:var(--dim)}
.card.on{box-shadow:inset 0 0 0 2px var(--shard)}
.card.ready small{color:var(--gold)}
.card[disabled]{opacity:.5;cursor:default}
.tag{font-size:10px;color:var(--line);background:var(--shard);padding:0 5px}
.go{appearance:none;border:0;background:var(--shard);color:var(--line);font:400 17px var(--font);padding:12px;cursor:pointer;box-shadow:inset 0 -4px 0 #4fb5c4;width:100%}
.go[disabled]{background:#4b3d7a;color:var(--dim);box-shadow:none;cursor:default}
.soulrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--panel);padding:8px}
.slots{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center}
.slots b{font-weight:400;font-size:20px;color:var(--dim)}
.slot{min-height:92px;align-content:center}
.slot .empty{height:48px;display:grid;place-items:center;font-size:26px;color:var(--dim)}
.card.static{cursor:default}
.foot{padding:9px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--panel)}
#reveal,#sheet{display:grid;justify-items:center;align-content:center;gap:10px;padding:18px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));text-align:center}
#revealArt,#sheetArt{height:190px;max-width:100%;image-rendering:pixelated}
#revealArt.charge{animation:charge .12s steps(2) infinite}
#revealArt.pop{animation:stamp .3s steps(4)}
@keyframes charge{50%{transform:translateX(3px) scale(1.04)}}
#revealTitle,#sheetTitle{font-size:26px;text-wrap:balance}
#revealText,#sheetText{font-size:14px;line-height:1.5;color:var(--dim);max-width:34ch}
#reveal .go,#sheet .go{max-width:300px}
.swap{display:grid;gap:6px;width:100%;max-width:300px}
.ghost{appearance:none;border:0;background:#4b3d7a;color:var(--cream);font:400 14px var(--font);padding:10px;cursor:pointer;width:100%}
.go:focus-visible,.ghost:focus-visible,.card:focus-visible,.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.skill.urgent,.gem.pop,#banner.show,#revealArt.charge,#revealArt.pop{animation:none}}
</style>

<div id="app">
  <canvas id="game" aria-label="샤들링 3마리가 떠 있는 섬에서 자동으로 사냥하는 게임 화면"></canvas>
  <div id="top" class="band">
    <div class="row"><div id="stage">1번 섬 · 새싹 들판</div><div id="lvl">0 G</div><div id="fps">-- fps</div></div>
    <div class="row"><div id="gaugeBar" class="bar"><i id="gauge"></i><b id="gaugeTxt">토벌 0/70</b></div></div>
    <div class="row">
      <div class="gems">
        <span class="gem" id="gFire" style="--c:var(--fire)">0</span>
        <span class="gem" id="gWater" style="--c:var(--water)">0</span>
        <span class="gem" id="gGrass" style="--c:var(--grass)">0</span>
        <span class="gem" id="gLight" style="--c:#ffe27a">0</span>
        <span class="gem" id="gDark" style="--c:#9b7fd6">0</span>
      </div>
      <button class="tiny" id="sound" type="button">소리</button>
      <button class="tiny" id="toTown" type="button">마을</button>
    </div>
  </div>
  <div id="banner"></div>
  <div id="hint">그냥 지켜보세요. 땅을 누르면 그쪽으로 이동해요.</div>
  <div id="bottom" class="band">
    <button class="skill" id="skCheer" type="button">응원<small>공격력 8초</small><span class="cd"></span></button>
    <button class="skill" id="skHeal" type="button">치유<small>회복·부활</small><span class="cd"></span></button>
    <button class="skill" id="skShield" type="button">보호막<small>보스 강타 막기</small><span class="cd"></span></button>
  </div>
  <div id="fade"></div>
  <div id="town" hidden>
    <canvas id="townScene" width="300" height="84" aria-label="조각 마을 풍경"></canvas>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="fuse">합성</button>
      <button type="button" role="tab" data-tab="party">샤들링</button>
      <button type="button" role="tab" data-tab="summon">소환</button>
      <button type="button" role="tab" data-tab="isle">섬</button>
    </div>
    <div id="townBody"></div>
    <div class="foot"><button class="go" id="depart" type="button">출발</button></div>
  </div>
  <div id="sheet" hidden>
    <canvas id="sheetArt"></canvas>
    <div id="sheetTitle"></div>
    <div id="sheetText"></div>
    <div class="swap" id="sheetSwap"></div>
    <button class="go" id="sheetClose" type="button">닫기</button>
  </div>
  <div id="reveal" hidden>
    <canvas id="revealArt"></canvas>
    <div id="revealTitle"></div>
    <div id="revealText"></div>
    <button class="go" id="revealOk" type="button" hidden>좋아요</button>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const W = 560, H = 720, VW = 300;
let VH = 400, topH = 0, botH = 0;
const cv = $('game'), ctx = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 임시 도트 (전부 코드로 새로 그림). 몸의 빛나는 조각이 샤들링의 표시 ----------
const SLIME = [
  '....kkkkkk....','..kkllbbbbkk..','.kllbbbbbbbbk.','.klbbbbbbbbbk.','kbbbweebweebbk',

const CROWN = [
  '......kSk.....','.....ksssk....','....kkkkkkk...','..kkllbbbbkk..','.kllbbbbbbbbk.','.klbbbbbbbbbk.','kbbbweebweebbk',
  'kbbbeeebeeebbk','kbcbbbbbbbbcbk','kbbbbbbddbbbbk','.kdbbbbbbbbdk.','..kkddddddkk..'];
const FIRE = [
  '......kSk.......','....kksskk......','...kllbbbbk.....','..klbbbbbbbk....','.kbbweebweebk...',
  '.kbbeeebeeebk.kk','.kcbbbbbbbbck.kx','.kbbbbddbbbbkkxk','..kbbbbbbbbbbxk.','..kdbbbbbbbddk..','..kkdk...kdkk...'];
const WATER = [
  '..kk..kSk..kk...','.kllk.kssk.kllk.','.kbbkkbbbbkkbbk.','..kkllbbbbbbkk..','..klbbbbbbbbbk..','.kbbweebweebbk..',
  '.kbbeeebeeebbk..','.kcbbbbbbbbbck..','.kbbbbbddbbbbbk.','..kllllllllllk..','...kkddddddkk...'];
const GRASS = [
  '...kk......kk...','..kllk.kSk.kllk.','..kbbk.ksk.kbbk.','..kbbkkkkkkkbbk.','...kllbbbbbbbk..','..klbbbbbbbbbbk.',
  '..kbweebbweebbk.','..kbeeebbeeebbk.','..kcbbbbbbbbbck.','..kbbbbbddbbbbk.','...kdbbbbbbbdk..','...kkdk...kdkk..'];
const HERO = [
  '...kkkkkk...','..khhhhhhk..','.khHHhhhhhk.','.khhhhhhhhk.','.khffffffhk.','.kfeeffeefk.','.kffcffcffk.',
  '..kkffffkk..','..kTtttTk...','.kfktttkfk..','..kttttttk..','...kmkkmk...','...kkk.kkk..'];
const BASE = { k:'#2b2140', w:'#ffffff', e:'#2b2140', c:'#ff8fa3', s:'#7fe9ff', S:'#eaffff', x:'#3b3350' };
const PAL = {
  fire:{ b:'#ff8a5c', l:'#ffc08a', d:'#d95a3c' },
  water:{ b:'#58b6f0', l:'#a6e0fa', d:'#3a86cc' },
  grass:{ b:'#7fd46a', l:'#bdf0a0', d:'#4fa550' },
  light:{ b:'#ffe27a', l:'#fff6c9', d:'#e0b340' },
  dark:{ b:'#9b7fd6', l:'#c9b5f0', d:'#6a4fa8' },
};
const HEROPAL = { h:'#7a4a8f', H:'#a874b8', f:'#ffdcbc', e:'#2b2140', c:'#ff9fa8', t:'#f2f0ff', T:'#ffd45e', m:'#5d4a8a', k:'#2b2140' };
function sprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((r, j) => [...r].forEach((ch, i) => { const col = pal[ch] || BASE[ch]; if (col && ch !== '.') { x.fillStyle = col; x.fillRect(i, j, 1, 1); } }));
  const f = document.createElement('canvas'); f.width = w; f.height = h;
  const y = f.getContext('2d'); y.drawImage(c, 0, 0); y.globalCompositeOperation = 'source-in'; y.fillStyle = '#fff'; y.fillRect(0, 0, w, h);
  return { n:c, f, w, h };
}
const SP = {
  fire:sprite(FIRE, PAL.fire), water:sprite(WATER, PAL.water), grass:sprite(GRASS, PAL.grass),
  sfire:sprite(SLIME, PAL.fire), swater:sprite(SLIME, PAL.water), sgrass:sprite(SLIME, PAL.grass), slight:sprite(SLIME, PAL.light), sdark:sprite(SLIME, PAL.dark),
  hero:sprite(HERO, HEROPAL),
};
// GPT 그림 3종. 불러오기 전과 실패했을 때는 코드 도트가 대신 나온다
function loadArt(key, src) {
  const im = new Image();
  im.onload = () => {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; c.getContext('2d').drawImage(im, 0, 0);
    const f = document.createElement('canvas'); f.width = im.width; f.height = im.height;
    const y = f.getContext('2d'); y.drawImage(c, 0, 0); y.globalCompositeOperation = 'source-in'; y.fillStyle = '#fff'; y.fillRect(0, 0, im.width, im.height);
    SP[key] = { n:c, f, w:im.width, h:im.height, art:true };
  };
  im.src = src;
}
loadArt('fire', 'art/fire.png'); loadArt('water', 'art/water.png'); loadArt('grass', 'art/grass.png');
const artFace = (sp, f) => sp.art ? -f : f; // 그림은 왼쪽을 보고 있음
const BIG = {};
['fire', 'water', 'grass'].forEach(k => { const im = new Image(); im.onload = () => { BIG[k] = im; }; im.src = `art/big/${k}.png`; });

// 빛·어둠과 합성 결과는 체형 3종에 색만 입힌 임시 그림. 머리의 조각 색은 그대로 둔다
const ELS = ['fire', 'water', 'grass', 'light', 'dark'];
const ELN = { fire:'불', water:'물', grass:'풀', light:'빛', dark:'어둠' };
const ELHUE = { fire:25, water:211, grass:90, light:48, dark:270 };
const BASEHUE = { fire:25, water:211, grass:90 };
function recolor(src, from, to) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  try {
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      if (!p[i + 3]) continue;
      const r = p[i] / 255, g = p[i + 1] / 255, b = p[i + 2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dl = mx - mn;
      if (dl < .08 || l < .07) continue;
      const s = dl / (1 - Math.abs(2 * l - 1));
      let h = mx === r ? 60 * (((g - b) / dl) % 6) : mx === g ? 60 * ((b - r) / dl + 2) : 60 * ((r - g) / dl + 4);
      if (h < 0) h += 360;
      if (s < .22 || (h > 172 && h < 199 && s > .5)) continue; // 크림색 피부와 조각
      const q = l < .5 ? l * (1 + s) : l + s - l * s, m = 2 * l - q, H = (h - from + to + 360) % 360;
      const f = t => { t = (t + 360) % 360; return t < 60 ? m + (q - m) * t / 60 : t < 180 ? q : t < 240 ? m + (q - m) * (240 - t) / 60 : m; };
      p[i] = f(H + 120) * 255; p[i + 1] = f(H) * 255; p[i + 2] = f(H - 120) * 255;
    }
    x.putImageData(d, 0, 0);
  } catch (e) { /* 색을 못 바꾸면 원래 색으로 보여 준다 */ }
  return c;
}
const spCache = {}, bigCache = {};
function getSp(m) {
  const base = SP[m.shape];
  if (m.shape === m.el || !base.art) return base;
  const k = m.shape + ':' + m.el;
  if (!spCache[k]) spCache[k] = { n:recolor(base.n, BASEHUE[m.shape], ELHUE[m.el]), f:base.f, w:base.w, h:base.h, art:true };
  return spCache[k];
}
function getBig(m) {
  const base = BIG[m.shape];
  if (!base) return getSp(m).n;
  const k = m.shape + ':' + m.el;
  if (!bigCache[k]) bigCache[k] = m.shape === m.el ? base : recolor(base, BASEHUE[m.shape], ELHUE[m.el]);
  return bigCache[k];
}
const hsl = (h, s, l) => `hsl(${h} ${s}% ${l}%)`;
const BOSSFR = Array.from({ length:8 }, (_, i) => { const h = i * 45; return sprite(CROWN, { b:hsl(h, 85, 66), l:hsl(h + 40, 90, 84), d:hsl(h - 30, 70, 50) }); });

// ---------- 떠 있는 섬 ----------
const MAPS = [
  { name:'새싹 들판', mobs:['grass', 'water', 'light'], g:['#7ccf6a','#6ec25e','#8edb7a'], earth:['#a26f49','#764c33'], leaf:['#3f9e58','#63c46f'], trunk:'#7a5236', fl:['#ffe27a','#ff9bb5','#ffffff'], sky:['#8fd6f5','#b5e6f8','#d9f2f4','#ffe9d6'] },
  { name:'단풍 고개', mobs:['fire', 'grass', 'dark'], g:['#d9b45e','#cfa44f','#e6c673'], earth:['#8f5f46','#5f3d33'], leaf:['#d9603f','#f2935a'], trunk:'#5e3d30', fl:['#ffe27a','#ff7f5e','#fff0c9'], sky:['#f7b98a','#fbd0a0','#fde2bb','#fff0d6'] },
  { name:'눈꽃 언덕', mobs:['water', 'light', 'dark'], g:['#e4f0fa','#d4e4f4','#f4fafe'], earth:['#7f8fb5','#56618c'], leaf:['#6d9fc7','#a8d3ea'], trunk:'#5e5474', fl:['#bfe9ff','#d6c9ff','#ffffff'], sky:['#6d7fc4','#8d9cd8','#b5bfe8','#d9dcf5'] },
];
const cx = W / 2, cy = H / 2;
let seed = 7;
function isLand(x, y) {
  const dx = (x - cx) / (W * .46), dy = (y - cy) / (H * .46), a = Math.atan2(dy, dx);
  return Math.hypot(dx, dy) < .94 + .07 * Math.sin(3 * a + seed) + .04 * Math.sin(7 * a + seed * 2);

  if (s.el === 'fire') { disc(x, y, r, '#ff5a2e'); disc(x, y, r - 2, '#ffb03b'); disc(x, y, Math.max(1, r - 4), '#fff3b0'); }

  else if (s.el === 'light') { disc(x, y, r, '#ffe27a'); ctx.fillStyle = '#ffffff'; const k = G.t * 12 | 0, L = r + 3; if (k % 2) { ctx.fillRect(x - L, y, L * 2 + 1, 1); ctx.fillRect(x, y - L, 1, L * 2 + 1); } else for (let i = -L + 2; i < L - 1; i++) { ctx.fillRect(x + i, y + i, 1, 1); ctx.fillRect(x + i, y - i, 1, 1); } disc(x, y, 1, '#ffffff'); }
  else if (s.el === 'dark') { disc(x, y, r, '#3b2a66'); disc(x, y, r - 2, '#9b7fd6'); disc(x + 1, y - 1, 1, '#e7dcff'); }
  else { disc(x, y, r, '#3f9e58'); disc(x - 1, y - 1, r - 2, '#9be27a'); ctx.fillStyle = '#2b2140'; ctx.fillRect(x - r + 1, y + 1, r * 2 - 2, 1); }

function blobCtx(x, y, r, col) { ctx.fillStyle = col; x = Math.round(x); y = Math.round(y); for (let j = -r; j <= r; j += 2) { const hw = Math.round(Math.sqrt(r * r - j * j)); ctx.fillRect(x - hw, y + Math.round(j * .7), hw * 2, 2); } }

// ---------- 화면 띠 ----------
const gemEl = { fire:$('gFire'), water:$('gWater'), grass:$('gGrass'), light:$('gLight'), dark:$('gDark') };

const cdBox = { skCheer:['cdCheer', 14], skHeal:['cdHeal', 12], skShield:['cdShield', 5] };
let lastHud = 0;
function hud() {
  const b = G.boss;

  else if (G.phase === 'warn') { $('gauge').style.width = '100%'; $('gaugeTxt').textContent = '보스 출현'; }
  else if (G.phase === 'clear') { $('gauge').style.width = '0%'; $('gaugeTxt').textContent = '정복 완료'; }
  else { $('gauge').style.width = G.kills / G.need * 100 + '%'; $('gaugeTxt').textContent = `토벌 ${G.kills}/${G.need}`; }
  $('lvl').textContent = G.gold + ' G';
  ELS.forEach(el => { gemEl[el].textContent = G.souls[el]; });
  for (const id in cdBox) { const [k, max] = cdBox[id]; $(id).querySelector('.cd').style.height = G[k] / max * 100 + '%'; }
  $('skShield').classList.toggle('urgent', !!(b && b.state === 'tele' && G.cdShield <= 0));
  $('hint').style.opacity = G.hintT > 0 ? 1 : 0;
}

function endStress() { G.enemies.splice(11); }

// ---------- 마을: 쌓은 것을 쓰는 느린 구간 ----------
let tab = 'fuse', slot = 'main', pick = { main:null, sub:null };
const fuseRate = st => { let r = .8; for (let i = 0; i < st; i++) r += (5 + 2 * i) / 100; return st >= 8 ? 1 : Math.min(1, r); };

function paint(cv, m, opt = {}) {

function resultOf(main, subEl) { const [shape, name] = RESULT[main.el][subEl]; return { el:main.el, shape, name, tier:2, base:RESULT_BASE, cap:RESULT_CAP, key:shape + ':' + main.el + ':2' }; }

  const body = $('townBody'), paints = [];

  if (tab === 'party') {
    body.innerHTML = `<h3>함께 사냥할 샤들링 3마리</h3><div class="grid3">${G.partyIds.map(id => monCard(G.roster.find(m => m.id === id), 'info', 'on')).join('')}</div>
      <h3>대기 중</h3><div class="grid3">${G.roster.filter(m => !G.partyIds.includes(m.id)).map(m => monCard(m, 'info')).join('') || '<p>대기 중인 샤들링이 없어요.</p>'}</div>
      <p>누르면 크게 보고 일행을 바꿀 수 있어요. 숫자 레벨은 샤들링마다 따로 올라요.</p>`;
  } else if (tab === 'summon') {
    body.innerHTML = `<h3>소울 ${SUMMON_COST}개로 소환</h3><p>그 속성의 1단계 개체 중 무엇이 나올지 몰라요. 레벨은 개체마다 정해진 기본 레벨로 나와요.</p>` + ELS.map(el => `<div class="soulrow"><span class="gem" style="--c:${COL[el]}">${ELN[el]}</span><span>${G.souls[el]} / ${SUMMON_COST}</span><button class="ghost" style="width:auto" type="button" data-act="summon" data-el="${el}" ${G.souls[el] < SUMMON_COST ? 'disabled' : ''}>${G.souls[el] < SUMMON_COST ? '부족' : '소환'}</button></div>`).join('');
  } else if (tab === 'isle') {
    let h = '<h3>어느 섬으로 갈까요</h3><div class="grid2">';
    for (let s = 1; s <= G.maxStage; s++) h += `<button class="card ${s === G.stage ? 'on' : ''}" type="button" data-act="isle" data-s="${s}"><span>${s}번 섬 · ${MAPS[(s - 1) % MAPS.length].name}</span><small>${MAPS[(s - 1) % MAPS.length].mobs.map(e => ELN[e]).join('·')} 소울${s === G.maxStage ? ' · 새 섬' : ''}</small></button>`;
    body.innerHTML = h + '</div><p>섬마다 나오는 샤들링과 소울이 달라요. 번호가 높을수록 적이 강해요. 원하는 소울이 나오는 섬을 골라 가세요.</p>';
  } else {
    const main = G.roster.find(m => m.id === pick.main), sub = G.roster.find(m => m.id === pick.sub);
    const slotCard = (kind, m, label) => { if (m) paints.push([m, {}, 'slot' + kind]); return `<button class="card slot ${slot === kind ? 'on' : ''}" type="button" data-act="slot" data-v="${kind}">${m ? `<canvas data-p="slot${kind}"></canvas><span>${m.name}</span>` : '<div class="empty">+</div>'}<small>${label}</small></button>`; };
    const res = main && sub ? resultOf(main, sub.el) : null;
    if (res) paints.push([res, { sil:!G.dex[res.key] }, 'slotres']);
    let h = `<div class="slots">${slotCard('main', main, '주재료')}<b>+</b>${slotCard('sub', sub, '부재료')}<b>=</b><div class="card slot static">${res ? `<canvas data-p="slotres"></canvas><span>${G.dex[res.key] ? res.name : '???'}</span>` : '<div class="empty">?</div>'}<small>결과</small></div></div>`;

      els.forEach(e => { const r = resultOf(main, e), seen = G.dex[r.key]; paints.push([r, { big:true, sil:!seen }, 'b' + e]); h += `<div class="card big static ${sub && sub.el === e ? 'on' : ''}"><canvas data-p="b${e}"></canvas><span>${seen ? r.name : '???'}</span><small>${ELN[e]} 부재료</small></div>`; });

        <button class="go" type="button" data-act="fuse" ${can ? '' : 'disabled'}>${sub ? (G.gold >= cost ? `합성하기 ${cost} G` : '골드가 부족해요') : '부재료를 골라 주세요'}</button>`;
    }

  }
  paints.forEach(([m, o, id]) => { const c = body.querySelector(`canvas[data-p="${id}"]`); if (c) paint(c, m, o); });
  $('depart').textContent = `${G.stage}번 섬으로 출발`;

function showInfo(id) {
  const m = G.roster.find(x => x.id === id), d = SHAPE[m.shape], inP = G.partyIds.includes(id);
  paint($('sheetArt'), m, { big:true });
  $('sheetTitle').textContent = m.name;
  $('sheetText').textContent = `${ELN[m.el]} ${m.tier}단계 · Lv ${m.level} (기본 Lv ${m.base}, 만렙 ${m.cap}) · ${d.role}. 기술: ${d.skill}, ${d.skillDesc}.`;
  $('sheetSwap').innerHTML = inP ? '' : G.partyIds.map(pid => `<button class="ghost" type="button" data-swap="${pid}" data-in="${id}">${G.roster.find(x => x.id === pid).name} 대신 함께 가기</button>`).join('');

}
function fuseNow() {
  const main = G.roster.find(m => m.id === pick.main), sub = G.roster.find(m => m.id === pick.sub);
  if (!main || !sub) return;
  const r = resultOf(main, sub.el), cost = fuseCost(main.stack);
  if (G.gold < cost) return;
  G.gold -= cost;
  const ok = Math.random() < fuseRate(main.stack), art = $('revealArt'), wasNew = !G.dex[r.key];
  paint(art, r, { big:true, sil:true });

  $('revealTitle').textContent = '조각이 서로 이끌려요'; $('revealText').textContent = `${main.name} + ${sub.name}`;
  $('reveal').hidden = false; audio(); fan([262, 330, 392, 523, 659], .22);
  setTimeout(() => {
    art.className = '';
    if (ok) {
      // 평균 올림 + 1~3 (피드백 57번). 기본 레벨보다 낮게 나와도 된다
      const level = Math.min(r.cap, Math.ceil((main.level + sub.level) / 2) + 1 + (Math.random() * 3 | 0)), made = newMon(r.el, r.shape, r.name, 2, level, r.base, r.cap);
      const i = G.partyIds.indexOf(main.id);
      G.roster = G.roster.filter(m => m !== main && m !== sub);
      G.partyIds = G.partyIds.filter(id => id !== sub.id);
      if (i >= 0) G.partyIds[G.partyIds.indexOf(main.id)] = made.id; else if (G.partyIds.length < 3) G.partyIds.push(made.id);
      G.roster.slice().sort((a, b) => b.tier - a.tier || b.level - a.level).forEach(m => { if (G.partyIds.length < 3 && !G.partyIds.includes(m.id)) G.partyIds.push(m.id); });
      paint(art, r, { big:true }); void art.offsetWidth; art.className = 'pop';
      const d = SHAPE[r.shape];
      $('revealTitle').textContent = wasNew ? `새로운 샤들링! ${r.name}` : r.name;
      $('revealText').textContent = `${ELN[r.el]} 2단계 · Lv ${level} (기본 Lv ${r.base}, 만렙 ${r.cap}) · ${d.role}. 기술: ${d.skill}, ${d.skillDesc}.`;
      fan([523, 659, 784, 1047, 1319, 1568], .08);
      slot = 'main'; pick = { main:null, sub:null };
    } else {
      main.stack++;
      $('revealTitle').textContent = '합성 실패';
      $('revealText').textContent = `재료는 그대로예요. 다음 성공률은 ${Math.round(fuseRate(main.stack) * 100)}%, 비용은 ${fuseCost(main.stack)} G예요.`;
      fan([330, 262, 196], .14);
    }
    $('revealOk').hidden = false;
  }, 1500);
}
function doSummon(el) {
  if (G.souls[el] < SUMMON_COST) return;
  G.souls[el] -= SUMMON_COST;
  const list = SPECIES[el], [shape, name, base, cap] = list[Math.random() * list.length | 0], isNew = !G.dex[shape + ':' + el + ':1'], m = newMon(el, shape, name, 1, base, base, cap);
  paint($('revealArt'), m, { big:true }); $('revealArt').className = 'pop';
  $('revealTitle').textContent = isNew ? `새로운 샤들링! ${name}` : name;
  $('revealText').textContent = `${ELN[el]} 1단계 · 기본 Lv ${base} · 만렙 ${cap} · ${SHAPE[shape].role}`;
  $('revealOk').hidden = false; $('reveal').hidden = false; audio(); fan(isNew ? [659, 784, 988, 1319] : [523, 659], .08);

function depart() {
  $('town').hidden = true; G.paused = false;
  syncParty();
  if (G.needNewMap) { G.needNewMap = false; loadMap(); banner(`${G.stage}번 섬<small>${MAPS[G.map].name}</small>`, 1500); }
}
$('town').addEventListener('click', e => {
  audio();
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; renderTown(); return; }
  const a = t.dataset.act, id = +t.dataset.id;
  if (a === 'info') showInfo(id);
  if (a === 'slot') { slot = t.dataset.v; renderTown(); }
  if (a === 'main') { pick = { main:id, sub:null }; slot = 'sub'; renderTown(); }
  if (a === 'sub') { pick.sub = id; renderTown(); }
  if (a === 'fuse') fuseNow();
  if (a === 'summon') doSummon(t.dataset.el);
  if (a === 'isle') { const s = +t.dataset.s; if (s !== G.stage) { G.stage = s; G.needNewMap = true; } renderTown(); }

$('depart').onclick = depart;
$('sheetClose').onclick = () => { $('sheet').hidden = true; };
$('sheetSwap').addEventListener('click', e => {
  const b = e.target.closest('[data-swap]'); if (!b) return;
  G.partyIds[G.partyIds.indexOf(+b.dataset.swap)] = +b.dataset.in;
  $('sheet').hidden = true; renderTown();

$('revealOk').onclick = () => { $('reveal').hidden = true; renderTown(); };
function townScene(t) {
  const c = $('townScene'), x = c.getContext('2d'), m = MAPS[0]; x.imageSmoothingEnabled = false;
  m.sky.forEach((col, i) => { x.fillStyle = col; x.fillRect(0, i * 11, 300, 12); });
  x.fillStyle = m.g[0]; x.fillRect(0, 44, 300, 40); x.fillStyle = m.g[2]; x.fillRect(0, 44, 300, 3);
  // 임시 마을 집
  [[26, '#c9694f'], [244, '#5f8fc9']].forEach(([hx, roof]) => {
    x.fillStyle = '#2b2140'; x.fillRect(hx - 1, 25, 34, 25);
    x.fillStyle = '#fff0d6'; x.fillRect(hx, 28, 32, 21);
    x.fillStyle = roof; for (let j = 0; j < 9; j++) x.fillRect(hx - 3 + j * 2, 27 - j * 2, 38 - j * 4, 2);
    x.fillStyle = '#7a5236'; x.fillRect(hx + 12, 37, 8, 12);
  });
  G.partyIds.forEach((id, i) => {
    const mon = G.roster.find(q => q.id === id); if (!mon) return;
    const sp = getSp(mon), hop = Math.abs(Math.sin(t * 2.2 + i * 1.7)) * 3, px = 92 + i * 52;
    x.fillStyle = 'rgba(30,20,50,.28)'; x.fillRect(px + 4, 76, sp.w - 8, 3);
    x.drawImage(sp.n, px, Math.round(46 - hop));
  });
}

// ---------- 입력 ----------
cv.addEventListener('pointerdown', e => {
  audio();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * VW + G.cam.x, y = (e.clientY - r.top) / r.height * VH + G.cam.y;
  if (!isLand(x, y)) return;
  G.cmd = { x, y, t:2.4 }; G.ripple = { x, y, t:0 }; G.hintT = 0; blip('tap', 520, .04, 'square', .02);
});
$('skCheer').onclick = () => skill('cheer');
$('skHeal').onclick = () => skill('heal');
$('skShield').onclick = () => skill('shield');
$('sound').onclick = () => { audio(); G.muted = !G.muted; $('sound').textContent = G.muted ? '소리 꺼짐' : '소리'; };
$('toTown').onclick = () => {
  audio();
  if (G.phase === 'clear') return;
  if (G.phase !== 'hunt') { // 보스를 두고 돌아오면, 다시 나갔을 때 적 하나를 더 잡으면 보스가 처음부터 나온다
    G.boss = null; G.shots = []; G.phase = 'hunt'; G.kills = G.need - 1; G.party.forEach(u => { u.target = null; });
    $('gaugeBar').classList.remove('boss');
  }
  openTown('fuse');
};

function resize() {
  const r = $('app').getBoundingClientRect();
  if (!r.width || !r.height) return; // 숨겨진 채로 열리면 크기가 0이다
  VH = Math.round(r.height / (r.width / VW));
  cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;
  const k = VW / r.width; topH = $('top').offsetHeight * k; botH = $('bottom').offsetHeight * k;
  $('hint').style.bottom = $('bottom').offsetHeight + 10 + 'px';
}
addEventListener('resize', resize);
resize();
loadMap();

// ---------- 고리 ----------
let prev = performance.now(), fAcc = 0, fN = 0;
function frame(now) {
  const raw = Math.min(.05, (now - prev) / 1000), real = (now - prev) / 1000; prev = now;
  if (G.paused) townScene(now / 1000);
  else {
    G.slowT = Math.max(0, G.slowT - raw);
    update(raw * (G.slowT > 0 ? .35 : 1));
    draw();
  }
  if (now - lastHud > 90) { hud(); lastHud = now; }
  fAcc += real; fN++;
  if (fAcc >= .5) { const f = Math.round(fN / fAcc); $('fps').textContent = f + ' fps'; if (G.stress > 0) G.stressS.push(f); fAcc = 0; fN = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__sh = { G, update, draw, hud, skill, openTown, renderTown, depart, fuseRate };
})();
